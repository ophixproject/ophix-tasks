[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-tasks"
version = "2026.05.12.06"
description = "Task Scheduling domain plugin for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "ophix-server-base>=2026.05.05.02",
]

[project.entry-points."ophix.plugins"]
ophix_tasks = "ophix_tasks"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix_tasks" = [
    "deploy_templates/**/*",
    "static/**/*",
    "docs/**/*",
]
